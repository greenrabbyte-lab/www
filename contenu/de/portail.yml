trajet:
  titre: "Der Weg einer Anfrage"
  etapes:
    - titre: "Port"
      texte: "Das Formular schickt die Anfrage ab."
    - titre: "GitHub Actions"
      texte: "Der Workflow startet, ohne gespeichertes Azure-Passwort."
    - titre: "Azure"
      texte: "Terraform erstellt die Maschine und ihre Leitplanken."
    - titre: "Zurück in Port"
      texte: "Die Anfrage wird bei jedem Schritt aktualisiert."

a_retenir:
  titre: "Was wir daraus lernen"
  points:
    - "Mit einer einzigen, wirklich nützlichen Aktion anfangen: eine Arbeitsumgebung bekommen."
    - "Freigaben für das reservieren, was löscht oder Geld kostet. Alles andere läuft von selbst."
    - "Das Portal liest Azure nicht direkt: Der Workflow hält es aktuell. Für eine Maschine pro Anfrage reicht das."

premier_echec:
  titre: "Der erste Fehlschlag und seine Behebung"
  texte: "Beim ersten Start blieb die Aktion „in Bearbeitung“, ohne etwas auszulösen: Die Integrationsmethode war falsch. Der Fehler ist im Fehlerprotokoll des Labors erfasst, zusammen mit seiner Behebung."
